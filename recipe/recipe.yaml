# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: splunk-opentelemetry
  version: 2.13.0
  python_min: '3.10'
  python_max: '4.0'
  python_test_max: '3.14'
  opentelemetry_api_version: 1.44.0
  opentelemetry_instrumentation_version: 0.65b0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/3e/d9/ee4bbebcf30ce1872e714a327f1dc7b779e35d999e903ba77037ce90491c/splunk_opentelemetry-${{ version }}.tar.gz
  sha256: f2a506221704cc2cec30fda006bc5c693617f723745aa664fd8602a8fcb8a973

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<${{ python_max }}
    - opentelemetry-api ==${{ opentelemetry_api_version }}
    - opentelemetry-sdk ==${{ opentelemetry_api_version }}
    - opentelemetry-propagator-b3 ==${{ opentelemetry_api_version }}
    - opentelemetry-exporter-otlp-proto-grpc ==${{ opentelemetry_api_version }}
    - opentelemetry-exporter-otlp-proto-http ==${{ opentelemetry_api_version }}
    - opentelemetry-instrumentation ==${{ opentelemetry_instrumentation_version }}
    - opentelemetry-instrumentation-logging ==${{ opentelemetry_instrumentation_version }}
    - opentelemetry-instrumentation-system-metrics ==${{ opentelemetry_instrumentation_version }}
    - opentelemetry-semantic-conventions ==${{ opentelemetry_instrumentation_version }}
    - opentelemetry-opamp-client ==0.3b0
    - protobuf >=6.33.5
    - wrapt >=2.5.0
    - opentelemetry-propagator-b3 ==1.45.0
    - opentelemetry-semantic-conventions ==0.66b0
    - opentelemetry-instrumentation-system-metrics ==0.66b0
    - opentelemetry-instrumentation ==0.66b0
    - opentelemetry-api ==1.45.0
    - opentelemetry-configuration ==0.66b0
    - opentelemetry-sdk ==1.45.0
    - opentelemetry-instrumentation-logging ==0.66b0
    - requests >=2.7,<3.dev0
    - opentelemetry-exporter-otlp-proto-http ==1.45.0
    - opentelemetry-exporter-otlp-proto-grpc ==1.45.0
tests:
  - python:
      imports:
        - splunk_otel
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_test_max }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: The Splunk distribution of OpenTelemetry Python Instrumentation provides a Python agent that automatically instruments your Python application to capture and report distributed traces to SignalFx APM.
  homepage: https://github.com/signalfx/splunk-otel-python
  license: Apache-2.0
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt
  description: |
    This package provides entrypoints to configure OpenTelemetry.
  repository: https://github.com/signalfx/splunk-otel-python
  documentation: https://docs.splunk.com/observability/en/gdi/get-data-in/application/python/get-started.html

extra:
  recipe-maintainers:
    - soapy1
    - rxm7706
